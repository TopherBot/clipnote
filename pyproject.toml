[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipnote"
# Graceful fallback – if the name is taken on PyPI the CI step will rename it to "clipnote-lite"
version = "0.1.0"
description = "One‑liner clipboard saver for quick note‑taking"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "TopherBot", email = "topherbot@proton.me"}]
license = {text = "MIT"}
keywords = ["clipboard", "cli", "notes"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "pyperclip>=1.8",
    "tomli>=2.0; python_version < '3.11'"
]

[project.optional-dependencies]
# Extras for developers / CI
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "bandit",
]

[project.scripts]
clipnote = "clipnote.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
select = ["E", "F", "W", "C90", "N", "B", "D"]
ignore = ["D100", "D104"]
line-length = 88

[tool.mypy]
python_version = "3.10"
strict = true

[tool.bandit]
skips = ["B101"]
